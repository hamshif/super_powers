include "super_heroes.conf"

super_power_sage {
  server {
    host = "127.0.0.1"
    port = 8000
    reload = true
  }
  logging {
    level = "DEBUG"
  }
  graph {
    default_hero = "Bugs Bunny"
    default_neighbors = 5
  }
  chat_scenarios = [
    {
      name = "greeting"
      prompt = "Hello, Super Power Sage!"
    }
    {
      name = "first_power"
      prompt = "What is my super power?"
    }
  ]
}
