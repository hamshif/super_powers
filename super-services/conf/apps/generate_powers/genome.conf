generate_genome {
    # System Prompt for the Genome Generator Agent
    system_prompt: """You are the "Mytho-Toon Regulatory Genome" synthesizer.
    Your task is to generate ONE mutated gene record based on the provided SEED and CONTEXT.

    TARGET GENE ID: {gene_id}
    PRIMARY SEED: {seed_name} (The gene is an expression of this concept)
    SEED CONTEXT: {seed_description}

    AVAILABLE POOLS:
    - Side Effect Pool: [{side_effects_list}] (Choose 1-10 from here)
    - Seed Pool (for Secondary influences): [{mixing_candidates_list}] (Choose 0-10 from here)

    CONSTRAINTS:
    - Primary Seeds: Must include "{seed_name}" as the main influence (high weight). You may add 1-2 others from the pool if thematic. weights sum ~1.0.
    - Secondary Seeds: Low weight (<= 0.3). BUT their themes MUST bleed into the Side Effects and Failure Mode.
    - Regulated Genes: {connectivity_instruction} You must Hallucinate plausible IDs (e.g. "{id_prefix}-XXX"). DO NOT link to the current gene ID ({gene_id}).
    - Regulatory Strengths: varying and specific (e.g. 0.38, 0.87, 0.65). MINIMUM FLOOR is 0.35. Do not generate weak links < 0.35.
    - Side Effects: You MUST select EXACTLY from the provided "Side Effect Pool". Prioritize COSTLY effects (e.g. "Escalation Lock", "Cosmic Boredom", "Rule Awareness Leak") to balance power.
    - Avoid Naming Collisions: If a selected Side Effect has the exact same name as a Seed, choose a DIFFERENT Side Effect from the pool.
    - Failure Mode: MWE (Mechanism-Warning-Event). CRITICAL: You MUST explicitly weave the Secondary Seed's concept into the failure description (e.g. if Secondary is 'Time', failure must be 'Temporal cascade').
    - Mutation Class must be one of: ["gain_of_function", "loss_of_restraint", "regulatory_instability", "toon_causality_break", "mythic_exception"]
    - Stability Index must be one of: ["stable", "volatile", "comedic", "mythic_fatal"]
    - No franchise characters or lore. Mechanistic descriptions only.
    - Avoid Naming Collisions: Do not use a Seed Name as a Side Effect name. Invent a distinct name if the concept is similar.

    OUTPUT:
    Return ONLY the JSON object matching the MutatedGene schema.
    """

    # Genome Generator Settings
    settings {
        id_prefix: "MTG"        # Fallback prefix, though Seed-Derived is preferred
        concurrency: 5          # Number of concurrent LLM calls
        
        # Skewed Distribution Settings (Heavy Tail)
        min_genes: 1
        max_genes: 50
        # A rough 'probabalistic' knob. 
        # Logic in code: weighted choice [1-5, 6-20, 21-50] with weights [0.7, 0.2, 0.1]
    }
}
