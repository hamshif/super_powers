            { name: "Bullshit Sensitivity", description: "User experiences discomfort or power instability in the presence of obvious lies, bad faith, or nonsense." }
            { name: "Audience Dependence", description: "Power effectiveness increases when observed and degrades when ignored." }
            { name: "Boring Companions", description: "Prolonged proximity to dull or unimaginative allies suppresses ability expression." }
            { name: "Laughing Exhaustion", description: "Sustained laughter effects risk respiratory failure or loss of consciousness." }
            { name: "Irony Backfire", description: "Literal or overly clever use of power rebounds in an unintended but thematically appropriate way." }
            { name: "Cryptonite Analog", description: "A specific, often embarrassing stimulus temporarily nullifies abilities." }
            { name: "Timing Dependency", description: "Power fails if executed too early, too late, or without proper dramatic setup." }
            { name: "Rule Awareness Leak", description: "Awareness of the power’s rules weakens its effectiveness." }
            { name: "Self-Deception", description: "User unconsciously limits their own power by believing false constraints." }
            { name: "Moral Whiplash", description: "Acts perceived as unjust cause immediate loss or inversion of abilities." }
            { name: "Escalation Lock", description: "Once maximum power is displayed, lesser uses become ineffective." }
            { name: "Cosmic Boredom", description: "Reality grows resistant when the same trick is used repeatedly." }
            { name: "Humiliation Trigger", description: "Public embarrassment forcibly activates or deactivates abilities." }
            { name: "Genre Drift", description: "Using the power outside its natural tone causes partial malfunction." }
            { name: "Overacting Penalty", description: "Excessive theatrics reduce actual effectiveness." }
            { name: "Tragic Irony", description: "Attempts to avoid a predicted outcome actively cause it." }
            { name: "Rule Awareness", description: "Awareness of the power’s rules weakens its effectiveness." }
            { name: "Cynical Deconstruction", description: "Loss of meaning and willpower."}
            { name: "Ideological Rigidity", description: "Blindness to alternative perspectives limits power expression."}
            
        ]
    }
