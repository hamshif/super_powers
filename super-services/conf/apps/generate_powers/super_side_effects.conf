generate_powers {
    library {
        side_effects = [
            { name: "Hubris", description: "Overconfidence increases power output while simultaneously degrading judgment." }
            { name: "Monologue Compulsion", description: "User feels an uncontrollable urge to explain plans, powers, or motivations aloud." }
            { name: "Narrative Punishment", description: "The universe responds to arrogance or certainty with ironic failure." }
