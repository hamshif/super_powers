


super_hero: "Buggs Bunny"

include "super_powers_seeds.conf"
include "super_side_effects.conf"
include "genome.conf"


generate_powers {
    library {
        seeds_file: "super_powers_seeds.conf"
        side_effects_file: "super_side_effects.conf"
    }
    vars {
        # Quantitative Dials
        similarity_target: "0.7-0.9"
        max_mixed_influence: 0.3
        
        # Qualitative Instruction Dials (Default: Conservative/Strict)
        neighbor_definition: "strictly 'near neighbors' in the ability space (low entropy)"
        causal_constraint: "Stay strictly within the seed’s causal mechanism."
        mixing_instruction: "Minimize mixed_seeds; use only when unavoidable."
        mixing_limit_instruction: "If present, total mixed seed influence must be ≤ " ${generate_powers.vars.max_mixed_influence} "."
        
        # Stochastic Controls
        selection_count: 5          # Number of random seeds to process from library
        mixing_min: 0               # Min mixing candidates per seed
        mixing_max: 3               # Max mixing candidates per seed
        side_effect_min: 2          # Min side effects to include
        side_effect_max: 3          # Max side effects to include
    }
    
    # Defaults handled in code via library
    n: 20
    temperature: 0.7 # Bumped up for stochastic variance
    
    system_prompt: """You are an expert game designer engine specializing in "superpower gradients". 
    Your task is to take a "Seed Ability" and expand it into a set of related abilities.
    
    SEED: {seed_name}
    CONTEXT: {seed_description}

    CONSTRAINTS:
    - {causal_constraint}
    - Variants must be {neighbor_definition}.
    - Prefer single-mechanism deviations (scope, duration, precision, activation).
    - {mixing_instruction}
    - {mixing_limit_instruction}
    - Avoid elemental, stylistic, or domain jumps.
    - No lore, characters, or narrative context.
    
    MIXING & INFLUENCES:
    - Primary Source: The Seed Ability.
    - Secondary Candidates: [{mixing_candidates_list}]. 
       - INSTRUCTION: You MUST incorporate traits from these candidates into at least 50% of the variants.
       - You are encouraged to combine MULTIPLE candidates into a single variant where creative.
       - Vary the `influence` score (e.g., 0.1 to 0.4) to reflect different concentrations.
    - Side Effects / Flaws: [{side_effects_list}].
       - INSTRUCTION: You MUST apply one or more Side Effects from this list to at least 80% of the variants.

    SEMANTICS:
    - Similarity Gradient = proximity to seed in causal-mechanism space.
    - Similarity Gradient (≈ {similarity_target}) is expected.

    DESCRIPTION RULE:
    - Each variant description must state mechanism + constraint.
    
    SIDE EFFECT RULE:
    - When applying Side Effects, choose ones that create interesting narrative friction or balance.
    - If applied, include the Side Effect Name in the `side_effects` list.
    - Do not invent new side effects; use only the ones listed in context.
    - Repetition of side effects across different variants is ACCEPTABLE and REQUIRED to meet the 80% quota.

    GOAL:
    Produce clean, tightly clustered ability variants suitable for later recombination.
    Generate exactly the number of variants requested.
    Output must be strictly structured according to the provided schema.
    """
}
