generate_powers {
    library {
        seeds = [
            # --- Toon Force / Slapstick Reality ---

            { name: "Toon Force", description: "Cartoon logic overrides physical law, allowing survival, recovery, and action based on comedic timing rather than causality." }
            { name: "Delayed Consequences", description: "Physical effects occur only after the user becomes aware of them, often triggered by realization or embarrassment." }
            { name: "Gravity Forgetfulness", description: "Gravity does not apply until the user acknowledges the absence of solid ground." }
            { name: "Hammerspace Access", description: "Retrieving oversized or impossible objects from a non-existent extradimensional pocket." }
            { name: "Anvil Magnetism", description: "Heavy objects, especially anvils, are unnaturally drawn to fall toward a designated target." }
            { name: "Rubber Physiology", description: "The body stretches, compresses, and deforms elastically without injury." }
            { name: "Painted Reality Traversal", description: "Two-dimensional depictions temporarily become physically traversable to the user." }
            { name: "Imagination Materialization", description: "Imagined objects briefly manifest as physical props with limited durability." }
            { name: "Outwitting Compulsion", description: "Opponents are drawn into self-defeating agreements or traps through verbal misdirection." }
            { name: "Involuntary Mooning", description: "Stress or surprise triggers spontaneous, humiliating exposure that disrupts opponents." }

            # --- Mythic / Greek Archetypes ---

            { name: "Divine Lightning", description: "Summoning and directing celestial lightning as an expression of divine authority." }
            { name: "Sea Dominion", description: "Command over oceanic forces, tides, and marine life." }
            { name: "Underworld Passage", description: "Traversal and limited authority within realms of the dead." }
            { name: "Heroic Strength", description: "Superhuman physical power derived from divine or heroic lineage." }
            { name: "Mythic Invulnerability", description: "Resistance to harm except under narrowly defined conditions." }
            { name: "Protean Shapeshifting", description: "Fluid alteration of physical form into animals, humans, or elemental states." }
            { name: "Prophetic Sight", description: "Perception of future events expressed through symbolic or cryptic visions." }
            { name: "Irresistible Allure", description: "Compelling affection or desire that overrides rational judgment." }
            { name: "Tactical Genius", description: "Supernaturally enhanced strategic foresight in conflict and planning." }
            { name: "Divine Revelry", description: "Creation of intoxicants and euphoric states that alter behavior and perception." }

            # --- Marvel-Style Superhuman Baselines ---

            { name: "Flight", description: "Sustained self-directed movement through the air independent of lift surfaces." }
            { name: "Super Speed", description: "Movement and reaction far exceeding human physiological limits." }
            { name: "Energy Projection", description: "Emission of concentrated energy in controlled forms." }
            { name: "Regeneration", description: "Rapid biological repair restoring damaged tissue." }
            { name: "Invisibility", description: "Suppression or redirection of sensory detection." }
            { name: "Force Field Generation", description: "Projection of protective energy barriers." }
            { name: "Wall Crawling", description: "Adherence to vertical and inverted surfaces." }
            { name: "Enhanced Senses", description: "Perceptual abilities operating beyond normal human thresholds." }
            { name: "Cosmic Empowerment", description: "Augmentation by exposure to vast cosmic energies." }
            { name: "Mystic Arts", description: "Reality manipulation through learned arcane practices." }

            # --- DC / Metahuman Extremes ---

            { name: "Heat Vision", description: "Emission of focused thermal energy through ocular channels." }
            { name: "X-Ray Vision", description: "Perception through opaque matter across selective spectra." }
            { name: "Super Breath", description: "Emission of high-pressure air or cryogenic exhalation." }
            { name: "Size Alteration", description: "Voluntary increase or decrease of physical scale." }
            { name: "Phasing", description: "Passing through solid matter by desynchronizing molecular structure." }
            { name: "Elastic Physiology", description: "Extreme malleability allowing reshaping of limbs and body mass." }
            { name: "Self-Sustenance", description: "Independence from food, water, air, or sleep." }
            { name: "Super Leaping", description: "Extreme jumping capability exceeding normal locomotion." }

            # --- Mutant / Psionic Space (X-Men) ---

            { name: "Telepathy", description: "Direct mental communication and thought manipulation." }
            { name: "Telekinesis", description: "Mental manipulation of physical objects." }
            { name: "Magnetism Control", description: "Manipulation of magnetic fields and ferrous materials." }
            { name: "Healing Factor", description: "Accelerated recovery from injury and disease." }
            { name: "Optic Energy Emission", description: "Emission of concussive energy from the eyes." }
            { name: "Weather Control", description: "Manipulation of atmospheric conditions." }
            { name: "Intangibility", description: "Temporary loss of physical solidity." }
            { name: "Mutant Detection", description: "Sensing of genetic or energetic anomalies in others." }
            { name: "Omega Adaptation", description: "Near-limitless growth or evolution of a single power domain." }

            # --- Cross-Genre / Systemic Powers ---

            { name: "Pocket Dimension Access", description: "Creation or access to small self-contained extradimensional spaces." }
            { name: "Matter Manipulation", description: "Rearrangement of molecular or atomic structures." }
            { name: "Time Manipulation", description: "Localized control over temporal flow." }
            { name: "Reality Anchoring", description: "Stabilization of reality against alteration." }
            { name: "Probability Manipulation", description: "Influencing likelihood of events." }
            { name: "Concept Suppression", description: "Temporary nullification of abstract concepts such as ownership or distance." }
            { name: "Narrative Awareness", description: "Perception of narrative structure and causal storytelling rules." }
            
            # --- New User Requested Seeds ---
            
            { name: "Magic", description: "Raw manipulation of reality through arcane will, spells, and invocations." }
            { name: "Illusion", description: "Creation of sensory perceptions with no physical substance, deceiving the senses." }
            { name: "Love", description: "Induction of profound affection, empathy, and emotional bonding in others." }
            { name: "Morphing", description: "Complete alteration of physical form, mass, and material state to mimic other beings or objects." }
        ]
    }
}
